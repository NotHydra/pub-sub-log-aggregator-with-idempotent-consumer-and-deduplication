name: pub-sub-log-aggregator-with-idempotent-consumer-and-deduplication

services:
  aggregator:
    build:
      context: .
      args:
        SERVICE: aggregator
    container_name: aggregator
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    networks:
      - pubsub-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/stats')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  publisher:
    build:
      context: .
      args:
        SERVICE: publisher
    container_name: publisher
    ports:
      - "8081:8081"
    environment:
      - AGGREGATOR_URL=http://aggregator:8080
      - EVENT_COUNT=6000
      - DUPLICATE_RATE=0.25
      - BATCH_SIZE=100
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - pubsub-net
    restart: unless-stopped

networks:
  pubsub-net:
    driver: bridge
